<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CivicLoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="bar">
  <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="11" stroke="var(--accent)" stroke-width="3" stroke-dasharray="52 17" stroke-linecap="round"/><path d="M24 4v7h-7" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>CivicLoop</div>
  <nav aria-label="Main"><a href="#issues">Explore map</a><a href="#scoreboard">Scoreboard</a></nav>
  <button class="btn primary" data-act="newreport">+ Report issue</button>
  <div class="acct" id="acct"></div>
</div></header>
<main id="app"></main>
<footer>CivicLoop · Report it. Track it. Verify it’s fixed.</footer>
<dialog id="rdlg" aria-labelledby="rt"><div class="dh"><h2 id="rt">Report an issue</h2><button data-act="closereport" aria-label="Close">×</button></div><div class="db" id="rbody"></div></dialog>
<dialog id="dlg" aria-labelledby="dt"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
